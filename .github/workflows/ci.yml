# Main CI (contract: specs/005-editor-shell/contracts/ci.md).
# The file name and `name: CI` are stable: the future VS extension workflow (P4) chains after it.
name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: 1
  DOTNET_CLI_TELEMETRY_OPTOUT: 1

jobs:
  # Everything that is not a test project run: build, repository checks, CLI smoke and sample. Job layout:
  # specs/005-editor-shell/contracts/ci.md §1 (supersedes specs/001-modernize-build/contracts/ci-workflow.md).
  checks:
    name: Repository checks (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # MinVer computes each version from git height/tags (release contract §1); a shallow
          # clone falls back to the default version without a warning.
          fetch-depth: 0

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      # NuGet cache keyed on the central package versions and the project graph (CPM pins every
      # direct and transitive version, so lock files are not needed for a stable key).
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', 'Directory.Build.props', 'src/Directory.Build.props', 'tests/Directory.Build.props', 'global.json', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore NetPrints.slnx

      - name: Build
        run: dotnet build NetPrints.slnx -c Release --no-restore

      # Every graph's generated .netpc.g.cs must be up to date; exit 1 names the stale files. Runs before any
      # step that builds a sample: the SDK's NetPrintsGenerate target rewrites a stale file during `dotnet build`,
      # which would make this check pass on a file it just regenerated. The samples use the in-repo SDK, so the
      # check needs only the CLI and generator built above.
      - name: Graph checks
        run: |
          dotnet run --project src/NetPrints.Cli -c Release --no-build -- regen --check samples/HelloWorld
          dotnet run --project src/NetPrints.Cli -c Release --no-build -- format --check samples

      # Fails if any file would be reformatted by `dotnet format` (whitespace, style and analyzer
      # fixes from .editorconfig); run the same command locally to fix. RS1024's sites in
      # NetPrints.Reflection were fixed by hand in P1 T013 (an auto-fix there is a behavior change,
      # not a formatting one), so the diagnostic no longer needs excluding here.
      - name: Format check
        run: dotnet format NetPrints.slnx --verify-no-changes --no-restore

      - name: Hook tests
        run: python3 -m unittest discover -s tests/hooks

      # The desktop E2E project is built as part of the solution but only actually exercised in the
      # `e2e` job below (it needs Xvfb and NETPRINTS_E2E=1). With NETPRINTS_E2E unset the scenarios
      # skip and the always-on tests (failure capture, entry point, worker pool) still run, so this
      # step is a smoke check, not a required one. --ignore-exit-code 8 is scoped to this step: it
      # only tolerates a run where every test skipped, and the `e2e` job's --fail-skips guards that.
      - name: Desktop E2E (no display, always-on tests only)
        run: >
          dotnet test --project tests/NetPrints.Desktop.E2ETests -c Release --no-build
          -- --ignore-exit-code 8

      # `--version` prints "NetPrints.Cli <version>" and `--help` prints the usage; both exit 0.
      - name: CLI smoke
        run: |
          output=$(dotnet run --project src/NetPrints.Cli -c Release --no-build -- --version 2>&1)
          echo "$output"
          echo "$output" | grep -q "NetPrints.Cli"
          dotnet run --project src/NetPrints.Cli -c Release --no-build -- --help

      # The sample imports the generator built above from bin/$(Configuration); Configuration makes the
      # CLI's own `dotnet build` of it use Release like the solution build.
      - name: CLI sample compile and run
        env:
          Configuration: Release
        run: |
          output=$(dotnet run --project src/NetPrints.Cli -c Release --no-build -- run samples/HelloWorld/HelloWorld.csproj 2>&1)
          echo "$output"
          echo "$output" | grep -q "Hello, World!"

      # Building the sample regenerates a stale .g.cs in place; a committed file that changed fails the job.
      - name: Generated files unchanged
        run: git diff --exit-code -- '*.netpc.g.cs'

  # One leg per test project (tests/NetPrints.Desktop.E2ETests runs in `e2e`). CiWorkflowTests keeps this matrix
  # in step with tests/. --coverage runs each leg under Microsoft.Testing.Extensions.CodeCoverage (referenced via
  # tests/Directory.Build.props) with tests/CodeCoverage.config's static-only instrumentation: the default dynamic
  # mode crashed Core.Tests with an AccessViolationException whenever a test's child `dotnet` process loaded a
  # NetPrints assembly the host was running (docs/adr/0008-static-only-code-coverage.md). No --ignore-exit-code:
  # a "zero tests ran" exit (8) is a real failure for every leg, and an Avalonia.Headless.XUnit version mismatch
  # that breaks discovery must fail the UI leg, not go green with the suite silently gone.
  test:
    name: Test (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Core
            leg: core
            project: tests/NetPrints.Core.Tests
          - name: Catalog
            leg: catalog
            project: tests/NetPrints.Catalog.Tests
          - name: CLI
            leg: cli
            project: tests/NetPrints.Cli.Tests
          - name: Editor
            leg: editor
            project: tests/NetPrints.Editor.Tests
          - name: Editor UI (headless)
            leg: editor-ui
            project: tests/NetPrints.Editor.UITests
    env:
      # Snapshot actual/diff images, flow screenshots and per-test diagnostics of the headless UI leg.
      NETPRINTS_UI_ARTIFACTS: ${{ github.workspace }}/TestResults/ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', 'Directory.Build.props', 'src/Directory.Build.props', 'tests/Directory.Build.props', 'global.json', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Build
        run: dotnet build ${{ matrix.project }} -c Release

      - name: Test
        run: >
          dotnet test --project ${{ matrix.project }} -c Release --no-build
          --report-xunit-trx --results-directory TestResults
          -- --coverage --coverage-output-format cobertura
          --coverage-settings ${{ github.workspace }}/tests/CodeCoverage.config

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results-${{ matrix.leg }}
          path: TestResults/**/*.trx
          if-no-files-found: warn

      # Snapshot actual/diff images, flow screenshots and per-test diagnostics (tree dump + screenshots).
      - name: Upload UI artifacts
        if: always() && matrix.leg == 'editor-ui'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ui-headless
          path: TestResults/ui/**
          if-no-files-found: warn

      # Cobertura coverage from Microsoft.Testing.Extensions.CodeCoverage (--coverage above).
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-${{ matrix.leg }}
          path: TestResults/**/*.cobertura.xml
          if-no-files-found: warn

  # SC-005 and SC-006 wall-clock budgets at their strict values. Not a required check and not in build-test's needs:
  # a shared runner's speed is not something the product controls (issues #17, #18). The blocking legs run the same
  # tests with a sanity bound.
  perf:
    name: Performance budgets (non-blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', 'Directory.Build.props', 'src/Directory.Build.props', 'tests/Directory.Build.props', 'global.json', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Build
        run: dotnet build tests/NetPrints.Editor.Tests -c Release

      - name: Performance tests (strict budgets)
        env:
          NETPRINTS_PERF_STRICT: 1
        run: >
          dotnet test --project tests/NetPrints.Editor.Tests -c Release --no-build
          --report-xunit-trx --results-directory TestResults
          -- --filter-trait "Category=Performance"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results-perf
          path: TestResults/**/*.trx
          if-no-files-found: warn

  # M4 trimming ratchet (P5 preparation). Not a required check and not in the gate's needs: the count may only go down,
  # and eng/trim-warnings.txt holds today's count.
  trim-readiness:
    name: Trim warnings (non-blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', 'Directory.Build.props', 'src/Directory.Build.props', 'tests/Directory.Build.props', 'global.json', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Count IL2xxx/IL3xxx warnings of NetPrints.Editor
        run: bash eng/trim-warnings.sh

  # The one required status check (branch protection): its name must not change. Runs even when a job it needs
  # failed or was cancelled, and fails unless every needed job succeeded.
  build-test:
    name: Build and test (Linux)
    if: always()
    needs: [checks, test]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Require every job to succeed
        run: |
          echo "checks: ${{ needs.checks.result }}"
          echo "test: ${{ needs.test.result }}"
          [ "${{ needs.checks.result }}" = "success" ] && [ "${{ needs.test.result }}" = "success" ]

  e2e:
    name: Desktop E2E (Linux, Xvfb)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', 'Directory.Build.props', 'src/Directory.Build.props', 'tests/Directory.Build.props', 'global.json', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      # X server, window manager, input and screenshots, window state (xprop, xwininfo), GTK 3 for
      # the native file pickers and a cursor theme for named cursors.
      - name: Install X11 tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb openbox xdotool imagemagick x11-utils libgtk-3-0t64 adwaita-icon-theme

      # NetPrints.Generator is no longer on NetPrints.Editor's build graph (ADR-0009: a plain
      # ProjectReference to NetPrints.Generation replaced the ReferenceOutputAssembly=false + HintPath
      # reference that used to build it as a side effect). The tests below run the real Desktop app,
      # which execs the in-repo dev-mode generator (project-system.md §2.1) by path, so it must be
      # built explicitly here too, same as scripts/smoke-desktop.sh does for the published editor.
      - name: Build
        run: |
          dotnet build tests/NetPrints.Desktop.E2ETests -c Release
          dotnet build src/NetPrints.Generator -c Release

      # The tests start their own Xvfb on a free display (like xvfb-run -a) plus openbox.
      # --fail-skips turns any skipped test (e.g. NETPRINTS_E2E not reaching the test host, or a
      # skip condition that fires unexpectedly) into a failure, so this job cannot go green with
      # zero real coverage: neither "zero tests ran" (exit code 8, not ignored here) nor "every
      # test skipped" can pass silently.
      # NETPRINTS_E2E_WORKERS=1 on this runner's 4 vCPUs (batch D3): 2 concurrent editors under
      # llvmpipe software rendering still starved each other enough to blow a *different* test's
      # own internal wait once the dispatch-time-timeout fix (above) stopped masking it by killing
      # the slowest test early. One worker still exercises the pool/fresh-editor-per-rent code path,
      # just without CI-only CPU contention; the full worker-pool speedup still applies locally,
      # where there are cores to spare (see docs/adr/0006-parallel-desktop-e2e.md).
      - name: E2E tests
        env:
          NETPRINTS_E2E: 1
          NETPRINTS_E2E_WORKERS: 1
          NETPRINTS_UI_ARTIFACTS: ${{ github.workspace }}/TestResults/ui
        run: >
          dotnet test --project tests/NetPrints.Desktop.E2ETests -c Release --no-build
          --report-xunit-trx --results-directory TestResults -- --fail-skips on

      - name: Upload E2E artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-results
          path: |
            TestResults/**/*.trx
            TestResults/ui/**
            TestResults/e2e-timings-*.md
            TestResults/e2e-diagnostics/**
          if-no-files-found: warn

  packages:
    name: Packages (local feed)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', 'Directory.Build.props', 'src/Directory.Build.props', 'tests/Directory.Build.props', 'global.json', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      # `^...(-alpha\.0\.[0-9]+)?$` only matched the very first prerelease shape MinVer produces
      # (no tags yet, or straight past a stable release). Once any prerelease tag exists (v0.2.0-rc.1,
      # which release.yml's `prerelease: contains(github.ref_name,'-')` treats as an intended path),
      # MinVer versions later commits as e.g. `0.2.0-rc.1.<height>` and this step would fail on every
      # push/PR until a stable tag is cut. Assert valid SemVer 2.0 (with optional build metadata) and
      # reject the literal `0.0.0` default instead, which only shows up when MinVer can't compute a
      # height at all (for example a too-shallow clone).
      - name: MinVer version of an untagged commit
        run: |
          dotnet restore src/NetPrints.Core
          ver=$(dotnet msbuild src/NetPrints.Core/NetPrints.Core.csproj -t:MinVer -getProperty:MinVerVersion -p:Configuration=Release)
          echo "MinVer: $ver"
          if [ "$ver" = "0.0.0" ]; then
            echo "::error::MinVer computed the literal default 0.0.0 (no git height available?)"; exit 1
          fi
          [[ "$ver" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]

      - name: Pack into local-packages
        id: pack
        run: |
          v=$(scripts/pack-local.sh --print-version)
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Verify packages, tool and SDK from the local feed
        run: |
          [[ "${{ steps.pack.outputs.version }}" =~ ^0\.1\.0-local\.[0-9]{14}$ ]]
          scripts/verify-packages.sh local-packages "${{ steps.pack.outputs.version }}"

  desktop-publish:
    name: Self-contained editor smoke (linux-x64)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', 'Directory.Build.props', 'src/Directory.Build.props', 'tests/Directory.Build.props', 'global.json', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Publish
        run: >
          dotnet publish src/NetPrints.Desktop -c Release -r linux-x64 --self-contained
          -p:PublishSingleFile=false -p:PublishTrimmed=false -o out/linux-x64

      - name: Smoke (headless project check)
        run: scripts/smoke-desktop.sh out/linux-x64

  jsonschema:
    name: JSON Schema (metaschema, lint, validate)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Installs the sourcemeta jsonschema CLI pinned in mise.toml (ADR-0011).
      - uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5 # v5.0.0
        with:
          version: 2026.9.1

      - name: Validate schemas
        run: eng/validate-schemas.sh
