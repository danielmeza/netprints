# Main CI (contract: specs/001-modernize-build/contracts/ci-workflow.md).
# The file name and `name: CI` are stable: the future VS extension workflow (P4) chains after it.
name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: 1
  DOTNET_CLI_TELEMETRY_OPTOUT: 1

jobs:
  build-test:
    name: Build and test (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore NetPrints.sln

      - name: Build
        run: dotnet build NetPrints.sln -c Release --no-restore

      # Core, reflection, view-model and headless Avalonia UI tests (no display server needed).
      - name: Test
        run: dotnet test --solution NetPrints.sln -c Release --no-build --report-trx --results-directory TestResults

      # The CLI returns exit code 1 for --version until the P2 redesign and prints it to stderr,
      # so only the combined output is checked.
      - name: CLI smoke
        run: |
          output=$(dotnet run --project NetPrintsCLI -c Release --no-build -- --version 2>&1 || true)
          echo "$output"
          echo "$output" | grep -q "NetPrintsCLI"

      - name: CLI sample compile and run
        run: |
          output=$(dotnet run --project NetPrintsCLI -c Release --no-build -- -p samples/HelloWorld/HelloWorld.netpp -r 2>&1 || true)
          echo "$output"
          echo "$output" | grep -q "Hello, World!"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: TestResults/**/*.trx
          if-no-files-found: warn
